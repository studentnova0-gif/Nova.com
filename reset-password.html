<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova College | Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07111f, #123456);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #123456;
            font-size: 30px;
        }

        .logo p {
            color: #777;
            margin-top: 6px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #123456;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #123456;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b263f;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .success {
            display: block !important;
            background: #dff6e5;
            color: #176b2c;
        }

        .error {
            display: block !important;
            background: #ffe1e1;
            color: #a40000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123456;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Nova College</h1>
        <p>Student Portal</p>
    </div>

    <h2>Reset Password</h2>

    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            minlength="6"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
        >

        <button type="submit" id="resetButton">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

    <a href="/loginform.html" class="back">
        ← Back to Student Login
    </a>

</div>

<script>
    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const password =
            document.getElementById("password").value.trim();

        const confirmPassword =
            document.getElementById("confirmPassword").value.trim();

        if (password.length < 6) {
            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage(
                "Passwords do not match.",
                "error"
            );
            return;
        }

        const params = new URLSearchParams(
            window.location.search
        );

        const token = params.get("token");

        if (!token) {
            showMessage(
                "Password reset token is missing or invalid.",
                "error"
            );
            return;
        }

        button.disabled = true;
        button.textContent = "Resetting...";

        try {

            const response = await fetch(
                "/api/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {

                showMessage(
                    data.message ||
                    "Unable to reset password.",
                    "error"
                );

                button.disabled = false;
                button.textContent = "Reset Password";

                return;
            }

            showMessage(
                data.message ||
                "Password reset successfully. You can now log in.",
                "success"
            );

            form.reset();

            setTimeout(() => {
                window.location.href = "/loginform.html";
            }, 2500);

        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );

            showMessage(
                "Connection error. Please try again.",
                "error"
            );

            button.disabled = false;
            button.textContent = "Reset Password";
        }
    });
</script>

</body>
</html>
