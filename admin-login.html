        color: #095d98;
    }

        width: 100%;
        height: 50px;

        border: none;

        background: #0b70b7;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;

        margin-top: 5px;

    .login-btn:hover {
        background: #095d98;
    }

    .login-btn:disabled {

    }

    .message {
        display: none;

        background: #e8fff0;

        border: 1px solid #a9e9bd;

        color: #075b99;

        border: 1px solid #b8ddfa;

    .back-link {

            padding: 25px 20px;

            font-size: 24px;

</div>

<script>
"use strict";

/*
============================================================
NOVA COLLEGE
ADMIN LOGIN

AUTHENTICATION METHOD:
Secure HttpOnly admin cookie.

The admin token is NOT stored in JavaScript storage.

The browser automatically sends the HttpOnly cookie
with same-origin requests.
============================================================
*/


/* ============================================================
   ELEMENTS
============================================================ */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const showPasswordBtn =
    document.getElementById("showPassword");

const messageBox =
    document.getElementById("message");


/* ============================================================
   SHOW MESSAGE
============================================================ */

function showMessage(message, type = "info") {

    messageBox.textContent =
        String(message || "");

    messageBox.className =
        "message show " + type;
}


/* ============================================================
   HIDE MESSAGE
============================================================ */

function hideMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";
}


/* ============================================================
   READ RESPONSE SAFELY
============================================================ */

async function readJson(response) {

    const text =
        await response.text();

    if (!text) {
        return {};
    }

    try {

        return JSON.parse(text);

    } catch (error) {

        return {
            success: false,
            message: text
        };
    }
}


/* ============================================================
   VERIFY ADMIN SESSION
============================================================ */

async function verifyAdminSession() {

    const response =
        await fetch(
            "/api/admin/session",
            {
                method: "GET",

                headers: {
                    "Accept": "application/json"
                },

                credentials: "same-origin",

                cache: "no-store"
            }
        );


    const data =
        await readJson(response);


    if (
        !response.ok ||
        data.success !== true ||
        data.authenticated !== true
    ) {

        throw new Error(
            data.message ||
            "No active admin session."
        );
    }


    return data;
}


/* ============================================================
   CHECK EXISTING SESSION
============================================================ */

async function checkExistingSession() {

    try {

        const data =
            await verifyAdminSession();


        if (
            data.authenticated === true
        ) {

            showMessage(
                "Admin session found. Opening dashboard...",
                "success"
            );


            /*
            Store ONLY non-sensitive information.
            The actual authentication cookie remains
            HttpOnly and cannot be read by JavaScript.
            */

            if (data.admin) {

                try {

                    sessionStorage.setItem(
                        "novaAdmin",
                        JSON.stringify(
                            data.admin
                        )
                    );

                } catch (error) {

                    console.warn(
                        "Could not save admin information:",
                        error
                    );
                }


                if (data.admin.email) {

                    try {

                        sessionStorage.setItem(
                            "novaAdminEmail",
                            data.admin.email
                        );

                    } catch (error) {

                        console.warn(
                            "Could not save admin email:",
                            error
                        );
                    }
                }
            }


            window.location.replace(
                "/admin-dashboard.html"
            );

            return;
        }

    } catch (error) {

        /*
        No active session is normal when the
        administrator has not logged in.
        */

        console.log(
            "No existing admin session."
        );
    }


    hideMessage();
}


/* ============================================================
   SHOW / HIDE PASSWORD
============================================================ */

showPasswordBtn.addEventListener(
    "click",
    function () {

        const isVisible =
            passwordInput.type === "text";


        passwordInput.type =
            isVisible
                ? "password"
                : "text";


        showPasswordBtn.textContent =
            isVisible
                ? "Show"
                : "Hide";
    }
);


/* ============================================================
   ADMIN LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        /* ----------------------------------------------------
           VALIDATION
        ---------------------------------------------------- */

        if (!email) {

            showMessage(
                "Please enter the admin email.",
                "error"
            );

            emailInput.focus();

            return;
        }


        if (!password) {

            showMessage(
                "Please enter the admin password.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        /* ----------------------------------------------------
           LOADING STATE
        ---------------------------------------------------- */

        loginBtn.disabled = true;

        loginBtn.classList.add(
            "loading"
        );

        loginBtn.textContent =
            "Signing in...";


        try {

            /* =================================================
               LOGIN REQUEST
            ================================================= */

            const response =
                await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        /*
                        VERY IMPORTANT:

                        Allows browser to receive and use
                        the HttpOnly admin cookie.
                        */

                        credentials:
                            "same-origin",

                        cache:
                            "no-store",

                        body:
                            JSON.stringify({
                                email: email,
                                password: password
                            })
                    }
                );


            /* =================================================
               READ SERVER RESPONSE
            ================================================= */

            const data =
                await readJson(response);


            console.log(
                "Admin login response:",
                data
            );


            /* =================================================
               CHECK LOGIN RESULT
            ================================================= */

            if (
                !response.ok ||
                data.success !== true
            ) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Invalid admin credentials."
                );
            }


            /* =================================================
               LOGIN SUCCESSFUL
            ================================================= */

            loginBtn.textContent =
                "Verifying...";


            /* =================================================
               VERIFY COOKIE SESSION
            ================================================= */

            const verified =
                await verifyAdminSession();


            if (
                verified.authenticated !== true
            ) {

                throw new Error(
                    "Admin login succeeded, but the admin session could not be verified."
                );
            }


            /* =================================================
               SAVE NON-SENSITIVE ADMIN INFORMATION
            ================================================= */

            if (verified.admin) {

                try {

                    sessionStorage.setItem(
                        "novaAdmin",
                        JSON.stringify(
                            verified.admin
                        )
                    );

                } catch (error) {

                    console.warn(
                        "Could not save admin information:",
                        error
                    );
                }


                if (
                    verified.admin.email
                ) {

                    try {

                        sessionStorage.setItem(
                            "novaAdminEmail",
                            verified.admin.email
                        );

                    } catch (error) {

                        console.warn(
                            "Could not save admin email:",
                            error
                        );
                    }
                }

            } else {

                try {

                    sessionStorage.setItem(
                        "novaAdminEmail",
                        email
                    );

                } catch (error) {

                    console.warn(
                        "Could not save admin email:",
                        error
                    );
                }
            }


            /* =================================================
               SUCCESS
            ================================================= */

            showMessage(
                "Admin login successful. Opening dashboard...",
                "success"
            );


            loginBtn.textContent =
                "Opening dashboard...";


            setTimeout(
                function () {

                    window.location.replace(
                        "/admin-dashboard.html"
                    );

                },
                400
            );


        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            let errorMessage =
                error.message ||
                "Admin login failed.";


            /*
            Handle connection errors separately.
            */

            if (
                error.name === "TypeError" ||
                errorMessage.includes("Failed to fetch") ||
                errorMessage.includes("NetworkError")
            ) {

                errorMessage =
                    "Connection error. Make sure the Nova College server is running on port 5000.";
            }


            showMessage(
                errorMessage,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.classList.remove(
                "loading"
            );

            loginBtn.textContent =
                "Login";
        }

    }
);


/* ============================================================
   START PAGE
============================================================ */

checkExistingSession();

</script>

</body>
</html>
